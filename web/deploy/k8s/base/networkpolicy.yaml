# User code runs inside these pods, so they get no outbound network at all
# (OpenSCAD never needs it). Inbound is limited to the HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openscad-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openscad-web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress: []
