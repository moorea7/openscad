apiVersion: apps/v1
kind: Deployment
metadata:
  name: openscad-web
  labels:
    app.kubernetes.io/name: openscad-web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: openscad-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openscad-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # The renderer runs untrusted user code: give it no API credentials.
      automountServiceAccountToken: false
      enableServiceLinks: false
      # > RENDER_TIMEOUT_SECONDS + preStop, so in-flight renders can finish.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: openscad-web
      containers:
        - name: web
          image: openscad-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: openscad-web
          env:
            - name: WORK_DIR
              value: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
              ephemeral-storage: 256Mi
            limits:
              # A runaway model is OOM-killed inside the pod; the request
              # gets a clear error and the web server keeps running.
              memory: 3Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          lifecycle:
            preStop:
              # Give the Service/Ingress time to drop this endpoint before
              # uvicorn stops accepting connections.
              exec:
                command: ["/bin/sleep", "10"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
