apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openscad
labels:
  - pairs:
      app.kubernetes.io/part-of: openscad-web
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: openscad-web
    newName: ghcr.io/your-org/openscad-web   # change me
    newTag: latest
