apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openscad-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openscad-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
